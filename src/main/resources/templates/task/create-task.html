<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Task</title>
    <link rel="stylesheet" th:href="@{/createandeditforms.css}">
</head>
<body>
<div th:replace="fragment/header :: header"></div>
<form th:action="@{/tasks/add}" th:object="${task}" method="post">
    <input type="hidden" th:field="*{projectId}">
    <input type="hidden" th:field="*{parentTaskId}">
    <p>
        <strong>Create new task</strong>
    </p>
    <label>
        Title: <input type="text" th:field="*{title}" maxlength="225" required>
    </label>
    <label>
        Description: <textarea th:field="*{description}" maxlength="1080"></textarea>
    </label>
    <label>
        Assign member: <select th:field="*{assignedMemberId}">
        <option th:each="member : ${members}"
                th:value="${member.id}"
                th:text="${member.name}">
        </option>
    </select>
    </label>
    <label>
        Estimated Time: <input type="number" th:field="*{timeEstimate}" min="1">
    </label>
    <label>
        High Priority: <input type="checkbox" th:field="*{highPriority}">
    </label>
    <input type="hidden" th:field="*{done}" th:value="false">
<div class="button-row" >
    <button class="btn" type="submit">Add Task</button>
    <button type="button" th:onclick="|window.location.href='/projects/' + ${task.projectId}|">Cancel</button>
</div>
</form>
</body>
</html>
