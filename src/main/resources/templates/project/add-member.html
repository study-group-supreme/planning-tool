<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add project member</title>
    <link rel="stylesheet" th:href="@{/index.css}">
</head>
<body>
<div th:replace="fragment/header :: header"></div>
<form class="member-list" th:action="@{/projects/{projectId}/add-member(projectId = ${projectId})}" method="post">
    <input type="hidden" th:value="${projectId}">
    <label>Add employee
        <select name="employeeId">
            <option th:each="employee : ${employees}"
                    th:text="${employee.name}"
                    th:value="${employee.id}"
            ></option>

        </select>
    </label>
    <button type="submit">Add</button>
</form>
<form th:action="@{/projects/{projectId}(projectId = ${projectId})}" method="get">
        <button class="Back-button" type="submit">Back to project details</button>
    </form></body>
</html>
