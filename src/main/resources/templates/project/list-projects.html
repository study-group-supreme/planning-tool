<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Project Overview</title>
</head>
<body>
<table>
    <tr>
<tr>Project</tr> <tr>Description</tr> <tr>Deadline</tr> <tr>Project Members </tr>
    </tr>
    <tr th:each="project : ${projects}">
        <td th:text="${project.getTitle()}"></td>
        <td th:text="${project.getDescription()}"></td>
        <td th:text="${project.getDeadline()}"></td>
        <td>
            <span th:each="employee : ${project.getProjectMembers()}">
                <span th:text="${employee.getName()}"></span>
            </span>

        </td>

    </tr>

</table>



</body>
</html>
