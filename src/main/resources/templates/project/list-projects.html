<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Project Overview</title>
</head>
<body>
<table>
    <tr>
        <th>Project</th>
        <th>Description</th>
        <th>Deadline</th>
    </tr>
    <tr th:each="project : ${projects}">
        <td th:text="${project.getTitle()}"></td>
        <td th:text="${project.getDescription()}"></td>
        <td th:text="${project.getDeadline()}"></td>
    </tr>

</table>


</body>
</html>
