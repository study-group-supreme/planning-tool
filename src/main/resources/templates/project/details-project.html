<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Show Project</title>
</head>
<body>
<div class="-details">
    <h1 th:text="${project.title}"></h1>
    <p th:text="${project.description}"></p>
</div>
<div class="dates">
    <p th:text="'Created: ' + ${project.getTimeOfCreation().toString()}"></p>
    <p th:if="${project.getDeadline() != null}" th:text="'Deadline: ' + ${project.getDeadline().toString()}"></p>
</div>
<table class="member-list">
    <tr>
        <td><strong>Project Members</strong></td>
    </tr>
    <tr th:each="member : ${project.getProjectMembers()}">
        <td th:text="${member.name}"></td>
    </tr>
</table>
<table class="task-list">
    <tr>
        <th>
            <strong>Tasks</strong>
        </th>
        <th>
            <p>Parent Task</p>
        </th>
    </tr>
    <tr th:each="task : ${project.getTasks()}">
        <td th:text="${task.title}"></td>
        <td>
            <form th:if = "${task.getParentTaskId() != null}" th:action="@{/tasks/remove}" method="post">
                <input type="checkbox" name="done" th:value="${task.done}">
                <input type="hidden" name="taskId" th:value="${task.id}">
                <input type="hidden" name="projectId" th:value="${project.id}" >
                <button type="submit">Mark done</button>
            </form>
        </td>
        <td th:if="${task.getParentTaskId()} != null">
            <span th:each="subTask : ${project.getTasks()}">
                <span th:if="${task.getParentTaskId()} == ${subTask.getId()}">
                    <span th:text="${subTask.title}"></span>
                </span>
            </span>
        </td>
    </tr>
</table>
<form th:action="@{/tasks/quick-add}" method="post">

    <input type="hidden" name="projectId" th:value="${project.id}">

    <input type="text" name="title" placeholder="Quick add task…" required>

    <button type="submit">Add</button>
</form>

<form th:action="@{/tasks/add}" method="get">
    <input type="hidden" name="projectId" th:value="${project.id}">
    <button type="submit">Create task</button>
</form>

</body>
</html>
